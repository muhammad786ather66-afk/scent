<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f4f4f5" />
      <stop offset="50%" stop-color="#d4d4d8" />
      <stop offset="75%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <linearGradient id="metalHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e4e4e7" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd094" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9a7632" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Top Monogram Emblem -->
  <g transform="translate(300, 68) scale(0.65)" filter="url(#softShadow)" text-anchor="middle">
    <!-- Left Flourish Loop -->
    <path d="M -24,-10 C -45,-30 -85,-25 -95,2 C -106,30 -80,68 -48,65 C -25,62 -12,42 -18,22 C -21,12 -32,8 -38,15 C -44,22 -36,36 -26,34" 
          fill="none" stroke="url(#metalLight)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Flourish Loop -->
    <path d="M 24,-10 C 45,-30 85,-25 95,2 C 106,30 80,68 48,65 C 25,62 12,42 18,22 C 21,12 32,8 38,15 C 44,22 36,36 26,34" 
          fill="none" stroke="url(#metalLight)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Left Outer V -->
    <path d="M -90,-75 C -75,-78 -58,-68 -52,-50 L -2,70" 
          fill="none" stroke="url(#metalHighlight)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Outer V -->
    <path d="M 90,-75 C 75,-78 58,-68 52,-50 L 2,70" 
          fill="none" stroke="url(#metalHighlight)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Apex -->
    <path d="M -14,52 L 0,82 L 14,52 Z" fill="url(#metalLight)" />
    <!-- Inner Arms -->
    <path d="M -22,40 L -46,-45 C -48,-62 -38,-72 -24,-74 C -16,-75 -8,-68 -12,-52 L -25,-4" 
          fill="none" stroke="url(#metalLight)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 22,40 L 46,-45 C 48,-62 38,-72 24,-74 C 16,-75 8,-68 12,-52 L 25,-4" 
          fill="none" stroke="url(#metalLight)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Bridge -->
    <path d="M -30,-8 L 0,35 L 30,-8" 
          fill="none" stroke="url(#metalHighlight)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark VELORA -->
  <text x="300" y="162" 
        font-family="'Playfair Display', 'Cinzel', 'Didot', 'Bodoni MT', serif" 
        font-size="44" 
        font-weight="600" 
        letter-spacing="18" 
        fill="url(#metalLight)" 
        text-anchor="middle">
    VELORA
  </text>

  <!-- Subtitle Tagline -->
  <text x="300" y="192" 
        font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" 
        font-size="10" 
        font-weight="500" 
        letter-spacing="7" 
        fill="url(#goldAccent)" 
        text-anchor="middle">
    WHERE SCENT BECOMES MEMORY
  </text>
  <line x1="160" y1="205" x2="440" y2="205" stroke="url(#goldAccent)" stroke-width="1" stroke-opacity="0.4" />
</svg>
